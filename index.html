<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledger</title>
    <style>
      :root {
        --ink: #16181d;
        --muted: #6b7280;
        --line: #e3e6ea;
        --bg: #f7f8fa;
        --card: #fff;
        --accent: #1f6feb;
        --up: #b42318;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }
      header { margin-bottom: 24px; }
      h1 { margin: 0; font-size: 26px; letter-spacing: -0.01em; }
      h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
      p { margin: 4px 0 0; }

      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .summary {
        background: #eef4ff;
        border: 1px solid #cfe0ff;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .row.spread { justify-content: space-between; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      .strong { font-weight: 600; }
      .error { color: var(--up); font-size: 13px; }
      .up { color: var(--up); }

      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        resize: vertical;
        margin-bottom: 12px;
      }
      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 7px;
        padding: 7px 14px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
      button:disabled { opacity: 0.45; cursor: default; }
      .file {
        font-size: 14px;
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline;
      }
      .file input { display: none; }

      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; }
      th {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        font-weight: 600;
      }
      tbody tr:last-child td { border-bottom: 0; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }

      .spark { width: 92px; height: 30px; display: block; }
      .spark polyline { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }

      .bars { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
      .bar { flex: 1; display: flex; flex-direction: column; height: 100%; }
      /* .fill needs a parent with a definite height or the flex algorithm sizes it
         and the percentage height is silently ignored -- every bar comes out equal. */
      .bar .track { flex: 1; display: flex; align-items: flex-end; }
      .bar .fill { width: 100%; background: #c7d7f5; border-radius: 3px 3px 0 0; min-height: 2px; }
      .bar span { font-size: 10px; color: var(--muted); text-align: center; padding-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
