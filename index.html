<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nickel and Dimed</title>
    <style>
      :root {
        --ink:      #18181b;
        --ink-soft: #3f3f46;
        --muted:    #71717a;
        --faint:    #a1a1aa;
        --line:     #e4e4e7;
        --line-soft:#f4f4f5;
        --bg:       #fafafa;
        --card:     #ffffff;
        --accent:   #4f46e5;
        --warn:     #b45309;
        --warn-bg:  #fef3c7;
        --alarm:    #b91c1c;
        --alarm-bg: #fee2e2;
        --radius:   10px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 1040px; margin: 0 auto; padding: 56px 28px 96px; }
      h1, h2, h3, p { margin: 0; }

      /* ---------------------------------------------------------- masthead */
      .masthead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 40px; }
      .masthead h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
      .masthead p { font-size: 13px; color: var(--muted); }

      /* The headline number. This is the entire product in one figure, so it gets
         the weight -- everything else on the page is supporting evidence. */
      .hero { margin-bottom: 40px; }
      .hero-num {
        font-size: 52px;
        line-height: 1.05;
        font-weight: 600;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .hero-label { font-size: 15px; color: var(--ink-soft); margin-top: 6px; }
      .hero-meta { font-size: 13px; color: var(--faint); margin-top: 14px; }
      .hero-meta span + span::before { content: "·"; margin: 0 8px; color: var(--line); }

      /* ------------------------------------------------------------- blocks */
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      /* A rule, not a filled box -- the prose should read as prose. */
      .summary {
        border-left: 2px solid var(--accent);
        padding: 2px 0 2px 18px;
        margin-bottom: 40px;
        font-size: 15px;
        line-height: 1.65;
        color: var(--ink-soft);
        max-width: 68ch;
      }
      .eyebrow {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
        margin-bottom: 14px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .row.spread { justify-content: space-between; }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); }
      .small { font-size: 12px; }

      /* ------------------------------------------------------------ ingest */
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
        resize: vertical;
        margin-bottom: 12px;
        outline: none;
      }
      textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e51a; }
      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 7px;
        padding: 7px 15px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
      button.ghost:hover:not(:disabled) { border-color: var(--faint); }
      button:disabled { opacity: 0.4; cursor: default; }
      .file { font-size: 13px; color: var(--accent); cursor: pointer; }
      .file:hover { text-decoration: underline; }
      .file input { display: none; }
      .error { color: var(--alarm); font-size: 13px; }

      /* ------------------------------------------------------------- table */
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 14px 10px; text-align: left; vertical-align: top; }
      th {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      tbody tr { border-bottom: 1px solid var(--line-soft); }
      tbody tr:last-child { border-bottom: 0; }
      tbody tr:hover { background: #fafafa; }
      td:first-child, th:first-child { padding-left: 0; }
      td:last-child,  th:last-child  { padding-right: 0; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }

      .vendor { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      /* Which item's price moved -- a vendor is not the unit of analysis, a
         product from that vendor is. */
      .item-line { font-size: 12px; color: var(--muted); margin-top: 1px; }
      /* Says out loud when a finding rests on invoice averages rather than unit
         prices, because that evidence cannot separate price from order size. */
      .basis {
        display: inline-block; margin-left: 6px;
        font-size: 10px; font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.04em; padding: 1px 5px; border-radius: 4px;
        background: var(--warn-bg); color: var(--warn); cursor: help;
      }
      /* The annualized figure is what the user acts on -- it outranks the row. */
      .impact { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
      .rank {
        font-size: 12px; font-variant-numeric: tabular-nums;
        color: var(--faint); padding-top: 3px;
      }

      /* Severity has to be visible before the digits are read. */
      .delta {
        display: inline-block;
        font-size: 12px; font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 2px 7px; border-radius: 5px;
        background: var(--warn-bg); color: var(--warn);
      }
      .delta.high { background: var(--alarm-bg); color: var(--alarm); }

      .spark { width: 104px; height: 30px; display: block; }
      .spark polyline {
        fill: none; stroke: #a1a1aa; stroke-width: 1.5;
        stroke-linejoin: round; vector-effect: non-scaling-stroke;
      }

      /* ------------------------------------------------------------- chart */
      .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
      .chart-max { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
      .chartwrap { position: relative; margin-top: 8px; }
      .idxchart { width: 100%; height: auto; display: block; overflow: visible; }
      .idxchart .grid { stroke: var(--line-soft); stroke-width: 1; }
      /* 100 is the reference the whole chart is read against, so it is drawn. */
      .idxchart .grid.base { stroke: #c7cbd1; stroke-dasharray: 3 3; }
      .idxchart .grid.vert { stroke: var(--line-soft); }
      .idxchart .tick { font-size: 10px; fill: var(--faint); }

      .idxchart .line {
        fill: none; stroke-width: 1.9;
        stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .idxchart .line { animation: none; stroke-dashoffset: 0; }
      }
      /* Vendors holding their prices recede; the ones costing money carry the ink.
         Stroke colour is set per vendor inline -- hue identifies which line is
         which, and the same hue keys that vendor's sparkline in the table. */
      .idxchart .line.flat { stroke-width: 1.3; }

      /* Invisible fat stroke: a 1.9px line is a hard mouse target. */
      .idxchart .hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }

      .idxchart g.dim .line, .idxchart .lbl.dim { opacity: 0.18; }
      .idxchart g, .idxchart .lbl { transition: opacity 140ms ease; }

      .idxchart .crosshair { stroke: #a1a1aa; stroke-width: 1; stroke-dasharray: 2 3; }
      /* Hollow ring, vendor-coloured inline: marks the month the detector fired. */
      .idxchart .mark { fill: #fff; stroke-width: 2.5; }
      .idxchart .dot { stroke: #fff; stroke-width: 1.5; }
      .idxchart .lbl { font-size: 11px; font-weight: 600; fill: var(--ink-soft); }

      /* ------------------------------------------------------------ readout */
      .tip {
        position: absolute; top: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        box-shadow: 0 4px 14px rgba(24, 24, 27, 0.08);
        pointer-events: none;
        min-width: 190px;
      }
      .tip-month {
        font-size: 11px; font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.05em;
        padding-bottom: 6px; margin-bottom: 6px;
        border-bottom: 1px solid var(--line-soft);
      }
      .tip-row {
        display: grid; grid-template-columns: 8px 1fr auto auto;
        align-items: center; gap: 8px;
        font-size: 12px; padding: 2px 0;
      }
      .swatch { width: 8px; height: 8px; border-radius: 2px; }
      .tip-name { color: var(--ink-soft); white-space: nowrap; }
      .tip-idx {
        font-variant-numeric: tabular-nums; font-weight: 600;
        color: var(--ink); min-width: 26px; text-align: right;
      }
      .tip-amt {
        font-variant-numeric: tabular-nums; color: var(--faint);
        min-width: 34px; text-align: right;
      }
      .empty { color: var(--muted); font-size: 14px; padding: 4px 0 2px; }

      /* ------------------------------------------------------- vendor drawer */
      tbody tr.clickable { cursor: pointer; }
      .scrim {
        position: fixed; inset: 0; background: rgba(24, 24, 27, 0.28);
        animation: fade 160ms ease; z-index: 40;
      }
      @keyframes fade { from { opacity: 0; } }
      .drawer {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
        width: min(560px, 94vw);
        background: var(--card);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 32px rgba(24, 24, 27, 0.10);
        display: flex; flex-direction: column;
        animation: slide 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .scrim, .drawer { animation: none; }
      }
      .drawer-head {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
        padding: 20px 22px 16px; border-bottom: 1px solid var(--line);
      }
      .drawer-title {
        display: flex; align-items: center; gap: 9px;
        font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
      }
      button.close { padding: 4px 9px; font-size: 13px; line-height: 1; }
      .drawer-body { overflow-y: auto; padding: 20px 22px 40px; }

      .statrow {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
        padding-bottom: 22px; margin-bottom: 24px; border-bottom: 1px solid var(--line-soft);
      }
      .stat { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

      table.mini td { padding: 7px 8px; font-size: 13px; border-bottom: 1px solid var(--line-soft); }
      table.mini td:first-child { padding-left: 0; }
      table.mini td:last-child { padding-right: 0; }
      table.mini tr:last-child td { border-bottom: 0; }
      .strong { font-weight: 600; }

      /* The receipts. Monospace because it is raw source text, not prose. */
      .invoices { display: flex; flex-direction: column; }
      .inv { padding: 9px 0; border-bottom: 1px solid var(--line-soft); }
      .inv:last-child { border-bottom: 0; }
      .inv-top {
        display: grid; grid-template-columns: 90px auto 1fr;
        align-items: center; gap: 10px;
      }
      .inv-date { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-soft); }
      .inv-amt { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; font-weight: 500; }
      .inv-lines { margin: 6px 0 4px; }
      .inv-line {
        display: grid; grid-template-columns: 1fr auto 72px;
        gap: 10px; font-size: 12px; padding: 1px 0;
        font-variant-numeric: tabular-nums;
      }
      .inv-raw {
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--faint); margin-top: 3px;
        word-break: break-all;
      }
      .conf {
        font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 1px 6px; border-radius: 4px; justify-self: start;
      }
      .conf.high   { background: #f4f4f5; color: var(--faint); }
      .conf.medium { background: var(--warn-bg); color: var(--warn); }
      .conf.low    { background: var(--alarm-bg); color: var(--alarm); }
      /* A human checked this one. Distinct from "the model felt confident". */
      .conf.corrected { background: #dcfce7; color: #15803d; cursor: help; }

      /* ------------------------------------------------------- corrections */
      .inv .tiny {
        font-size: 11px; padding: 2px 8px; margin-top: 6px;
        opacity: 0; transition: opacity 120ms ease;
      }
      .inv:hover .tiny, .inv:focus-within .tiny { opacity: 1; }
      .inv.editing { background: #fafafa; margin: 0 -10px; padding: 10px; border-radius: 8px; }
      .edit {
        font: inherit; font-size: 13px;
        border: 1px solid var(--line); border-radius: 6px;
        padding: 4px 7px; outline: none;
        font-variant-numeric: tabular-nums;
      }
      .edit:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e51a; }
      .edit.amt { text-align: right; width: 100px; justify-self: end; }
      .edit.date { width: 138px; }
      .inv-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .inv-actions button { font-size: 12px; padding: 5px 11px; }
      button.danger { color: var(--alarm); border-color: var(--alarm-bg); }
      button.danger:hover:not(:disabled) { border-color: var(--alarm); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
