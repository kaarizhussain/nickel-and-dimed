<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nickel and Dimed</title>
    <style>
      :root {
        --ink:      #18181b;
        --ink-soft: #3f3f46;
        --muted:    #71717a;   /* 4.6:1 on white -- passes AA for body text */
        --faint:    #8b8b93;   /* 3.6:1 -- decoration and large text only */
        --line:     #e4e4e7;
        --line-soft:#f4f4f5;
        --bg:       #f6f5f0;
        --card:     #fffefa;
        --accent:   #4f46e5;
        --warn:     #b45309;
        --warn-bg:  #fef3c7;
        --alarm:    #b91c1c;
        --alarm-bg: #fee2e2;
        --radius:   10px;

        /* Seven steps, not eleven ad-hoc sizes. Every font-size below is one of
           these. 13px and 14px were doing the same job in different places, and
           24/26 were two sizes for one role. */
        --t-xs:    11px;   /* eyebrows, badges, axis ticks */
        --t-sm:    12px;   /* meta and secondary detail */
        --t-base:  14px;   /* body, controls */
        --t-md:    16px;   /* emphasis: vendor names, prose, drawer titles */
        --t-lg:    20px;   /* secondary figures, page title */
        --t-xl:    28px;   /* per-finding impact */
        --t-hero:  44px;   /* the one number the product exists to produce */
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 88% 3%, rgba(199, 210, 254, 0.55), transparent 29rem),
          radial-gradient(circle at -8% 38%, rgba(254, 215, 170, 0.34), transparent 27rem),
          var(--bg);
        color: var(--ink);
        font: var(--t-base)/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 1120px; margin: 0 auto; padding: 20px 28px 96px; }
      h1, h2, h3, p { margin: 0; }

      /* ----------------------------------------------------------- topbar */
      .topbar {
        position: sticky; top: 12px; z-index: 12;
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        gap: 20px; padding: 12px 14px; margin-bottom: 22px;
        border: 1px solid rgba(228, 228, 231, 0.88); border-radius: 12px;
        background: rgba(255, 254, 250, 0.86);
        box-shadow: 0 8px 30px rgba(24, 24, 27, 0.06);
        backdrop-filter: blur(16px);
      }
      .topbar h1 { font-size: var(--t-lg); font-weight: 600; letter-spacing: -0.015em; }
      .topbar p { font-size: var(--t-base); color: var(--muted); margin-top: 2px; }
      .brand-lockup { display: flex; align-items: center; gap: 11px; }
      .brand-mark {
        position: relative; display: flex; align-items: flex-end; gap: 2px;
        width: 34px; height: 34px; padding: 8px;
        background: var(--ink); border-radius: 9px; transform: rotate(-2deg);
      }
      .brand-mark i { display: block; width: 4px; border-radius: 4px; background: #a5b4fc; }
      .brand-mark i:nth-child(1) { height: 8px; }
      .brand-mark i:nth-child(2) { height: 13px; background: #fca5a5; }
      .brand-mark i:nth-child(3) { height: 18px; background: #fcd34d; }
      .site-nav { display: flex; gap: 4px; padding: 3px; border-radius: 8px; background: #f4f4f5; }
      .site-nav a {
        color: var(--ink-soft); text-decoration: none; font-size: var(--t-sm);
        font-weight: 600; padding: 5px 9px; border-radius: 6px;
      }
      .site-nav a:hover { color: var(--ink); background: var(--card); }
      .topbar-right { display: flex; justify-content: flex-end; align-items: center; gap: 14px; }
      .demo-badge {
        padding: 5px 9px;
        border: 1px solid #c7d2fe;
        border-radius: 999px;
        background: #eef2ff;
        color: #3730a3;
        font-size: var(--t-xs);
        font-weight: 600;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        main { padding: 12px 14px 72px; }
        .topbar { position: relative; top: 0; grid-template-columns: 1fr auto; }
        .site-nav { display: none; }
        .topbar-right { align-items: flex-end; flex-direction: column; gap: 3px; }
        .topbar-right .demo-badge { white-space: normal; text-align: right; }
      }

      /* ------------------------------------------------------- case study */
      .story-hero {
        position: relative; overflow: hidden;
        display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(310px, 0.8fr);
        gap: 56px; align-items: center;
        padding: 64px 54px; margin-bottom: 28px;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.92), rgba(238,242,255,0.78)),
          var(--card);
        border: 1px solid rgba(199, 210, 254, 0.75); border-radius: 20px;
        box-shadow: 0 22px 60px rgba(79, 70, 229, 0.08);
      }
      .story-hero::after {
        content: ''; position: absolute; width: 280px; height: 280px; left: 46%; bottom: -220px;
        border: 46px solid rgba(79, 70, 229, 0.06); border-radius: 50%; pointer-events: none;
      }
      .story-kicker {
        color: var(--accent); font-size: var(--t-xs); font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 14px;
      }
      .story-copy h2 {
        max-width: 720px; font-size: clamp(38px, 5.4vw, 62px); line-height: 1.02;
        letter-spacing: -0.045em; font-weight: 650;
      }
      .story-copy h2 span { color: var(--accent); }
      .story-copy > p {
        max-width: 620px; margin-top: 22px; color: var(--ink-soft);
        font-size: 18px; line-height: 1.65;
      }
      .story-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
      .story-actions a {
        display: inline-flex; align-items: center; min-height: 42px;
        padding: 9px 16px; border-radius: 7px; font-weight: 600;
        text-decoration: none;
      }
      .story-primary { color: #fff; background: var(--accent); border: 1px solid var(--accent); }
      .story-secondary { color: var(--ink-soft); background: var(--card); border: 1px solid var(--line); }
      .story-actions a:focus-visible, .proof a:focus-visible {
        outline: 2px solid var(--accent); outline-offset: 3px;
      }
      .story-origin {
        max-width: 560px; margin-top: 20px; padding-left: 14px;
        border-left: 2px solid var(--line); color: var(--muted); font-size: var(--t-sm);
      }
      .trap-preview {
        position: relative; z-index: 1; padding: 22px;
        background: #18181b; color: #fff; border-radius: 14px;
        box-shadow:
          9px 9px 0 #c7d2fe,
          17px 17px 0 #fed7aa,
          0 28px 50px rgba(24, 24, 27, 0.16);
        transform: rotate(1deg);
      }
      .trap-label {
        color: #a1a1aa; font-size: var(--t-xs); font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 14px;
      }
      .trap-row {
        display: flex; justify-content: space-between; align-items: center; gap: 18px;
        padding: 14px; border-radius: 9px;
      }
      .trap-row div { display: flex; flex-direction: column; gap: 2px; }
      .trap-row div span { color: #a1a1aa; font-size: var(--t-sm); }
      .trap-row strong { font-size: var(--t-lg); font-variant-numeric: tabular-nums; }
      .trap-change {
        padding: 3px 8px; border-radius: 5px; font-size: var(--t-sm); font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .alarm-row { background: #3f1d23; }
      .alarm-row .trap-change { color: #fecaca; background: #7f1d1d; }
      .safe-row { background: #123229; }
      .safe-row .trap-change { color: #bbf7d0; background: #166534; }
      .trap-divider {
        position: relative; height: 25px; border-left: 1px dashed #52525b; margin-left: 28px;
      }
      .trap-divider span {
        position: absolute; left: -11px; top: 4px; padding: 0 4px;
        background: #18181b; color: #a1a1aa; font-size: var(--t-xs); text-transform: uppercase;
      }
      .trap-preview > p { margin-top: 15px; color: #d4d4d8; font-size: var(--t-sm); line-height: 1.55; }

      .story-section {
        margin: 56px 0 28px; padding: 36px;
        border: 1px solid #dcdcf7; border-radius: 18px;
        background: linear-gradient(145deg, #fffefa 0%, #f4f2ff 100%);
        box-shadow: 0 14px 40px rgba(24, 24, 27, 0.045);
      }
      .story-section-head { display: grid; grid-template-columns: 210px 1fr; gap: 2px 36px; }
      .story-section-head .story-kicker { grid-row: 1 / span 2; }
      .story-section-head h2, .proof-copy h2 {
        font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; font-weight: 650;
      }
      .story-section-head > p, .proof-copy > p {
        max-width: 670px; margin-top: 12px; color: var(--ink-soft); font-size: var(--t-md); line-height: 1.7;
      }
      .method-steps {
        display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
        margin-top: 34px;
      }
      .method-step {
        position: relative; min-height: 190px; padding: 20px;
        background: rgba(255, 254, 250, 0.9); border: 1px solid rgba(228,228,231,0.9);
        border-radius: 10px; box-shadow: 0 6px 20px rgba(24,24,27,0.035);
      }
      .method-step::after {
        content: '→'; position: absolute; top: 16px; right: 16px;
        color: #a5b4fc; font-size: var(--t-md); font-weight: 700;
      }
      .method-step:last-child::after { content: '✓'; color: #16a34a; }
      .method-step > span {
        display: block; color: var(--accent); font-size: var(--t-xs);
        font-weight: 700; letter-spacing: 0.08em; margin-bottom: 32px;
      }
      .method-step strong { display: block; font-size: var(--t-base); margin-bottom: 8px; }
      .method-step p { color: var(--muted); font-size: var(--t-sm); line-height: 1.6; }

      .proof {
        display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 44px;
        margin-top: 64px; padding: 42px;
        color: #fff;
        background:
          radial-gradient(circle at 92% 12%, rgba(79,70,229,0.28), transparent 18rem),
          linear-gradient(145deg, #18181b, #27272a);
        border-radius: 18px; box-shadow: 0 22px 60px rgba(24,24,27,0.16);
      }
      .proof .story-kicker { color: #a5b4fc; }
      .proof-copy > p { color: #d4d4d8; }
      .proof-copy a {
        display: inline-block; margin-top: 20px; color: #c7d2fe;
        font-weight: 600; text-underline-offset: 4px;
      }
      .proof-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
        align-self: start; background: #3f3f46; border: 1px solid #3f3f46;
        border-radius: 10px; overflow: hidden;
      }
      .proof-grid div { display: flex; flex-direction: column; padding: 18px; background: #27272a; }
      .proof-grid strong { font-size: 27px; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .proof-grid span { color: #a1a1aa; font-size: var(--t-sm); margin-top: 3px; }
      .proof-cases {
        grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr;
        gap: 8px 24px; padding-top: 22px; border-top: 1px solid #3f3f46;
        color: #d4d4d8; font-size: var(--t-sm);
      }
      .proof-cases span::first-letter { color: #86efac; }

      @media (max-width: 860px) {
        .story-hero { grid-template-columns: 1fr; gap: 38px; padding: 42px 36px; }
        .trap-preview { max-width: 560px; transform: none; }
        .method-steps { grid-template-columns: 1fr 1fr; }
        .proof { grid-template-columns: 1fr; }
      }
      @media (max-width: 620px) {
        .story-copy h2 { font-size: 40px; }
        .story-hero { padding: 34px 22px 40px; border-radius: 14px; }
        .story-section { padding: 24px 20px; }
        .story-section-head { grid-template-columns: 1fr; }
        .story-section-head .story-kicker { grid-row: auto; }
        .method-steps, .proof-grid, .proof-cases { grid-template-columns: 1fr; }
        .proof { padding: 28px 22px; }
      }

      /* --------------------------------------------------------------- kpis */
      /* The annual figure is the product. It gets its own cell, twice the type
         size of the others, and the first position. */
      .kpis {
        display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr;
        gap: 1px; background: var(--line);
        border: 1px solid var(--line); border-radius: var(--radius);
        overflow: hidden; margin-bottom: 28px;
        box-shadow: 0 10px 30px rgba(24,24,27,0.045);
      }
      .kpi { background: var(--card); padding: 18px 20px; }
      .kpi-num {
        font-size: var(--t-lg); font-weight: 600; letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .kpi.lead { color: #fff; background: linear-gradient(135deg, #4338ca, #6366f1); }
      .kpi.lead .kpi-num { font-size: var(--t-hero); line-height: 1.05; letter-spacing: -0.03em; }
      .kpi-label { font-size: var(--t-sm); color: var(--muted); margin-top: 5px; }
      .kpi.lead .kpi-label { font-size: var(--t-base); color: #e0e7ff; margin-top: 8px; }
      @media (max-width: 860px) {
        .kpis { grid-template-columns: 1fr 1fr; }
      }


      /* ------------------------------------------------------------- blocks */
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 18px 20px;
        margin-bottom: 20px;
        box-shadow: 0 8px 24px rgba(24,24,27,0.035);
      }
      /* The label sat above a paragraph capped at 70ch inside a ~980px card, so
         every line stopped 400px short of the right edge and the block read as
         broken rather than airy. Setting the label beside the prose spends that
         width on something, and keeps the measure readable. */
      .insight {
        border-left: 2px solid var(--accent);
        display: grid; grid-template-columns: 132px 1fr; gap: 8px 28px;
        align-items: start; padding: 22px 24px;
      }
      .insight .eyebrow { margin-bottom: 0; padding-top: 3px; }
      .insight-text {
        font-size: var(--t-md); line-height: 1.7; color: var(--ink-soft);
        max-width: 68ch;
      }
      @media (max-width: 720px) {
        .insight { grid-template-columns: 1fr; gap: 10px; }
        .insight .eyebrow { padding-top: 0; }
      }
      .section-head { margin: 56px 0 18px; align-items: flex-end; }
      .findings-title { font-size: 30px; line-height: 1.15; letter-spacing: -0.025em; }
      .findings-intro { color: var(--muted); font-size: var(--t-base); margin-top: 7px; }
      .eyebrow {
        font-size: var(--t-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .row { display: flex; align-items: center; gap: 12px; }
      .row.spread { justify-content: space-between; }
      .muted { color: var(--muted); }
      /* Anything carrying meaning uses --muted; --faint is for decoration.
         #a1a1aa measured 2.56:1 against white, well under the 4.5:1 AA floor, and
         it was being used for the confidence evidence line -- the text that makes a
         finding trustworthy. */
      .faint { color: var(--muted); }
      .small { font-size: var(--t-sm); }

      /* ------------------------------------------------------------ ingest */
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: var(--t-sm)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink);
        resize: vertical;
        margin-bottom: 12px;
        outline: none;
      }
      textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e51a; }
      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        border-radius: 7px;
        padding: 7px 15px;
        font: inherit;
        font-size: var(--t-base);
        font-weight: 500;
        cursor: pointer;
      }
      button.ghost { background: transparent; color: var(--ink-soft); border-color: var(--line); }
      button.ghost:hover:not(:disabled) { border-color: var(--faint); }
      button:disabled { opacity: 0.4; cursor: default; }
      .file { font-size: var(--t-base); color: var(--accent); cursor: pointer; }
      .file:hover { text-decoration: underline; }
      .file input { display: none; }
      .error { color: var(--alarm); font-size: var(--t-sm); }

      /* -------------------------------------------------------------- cards */
      /* One card per finding instead of a spreadsheet row. Reading order is who ->
         what moved -> by how much -> what it costs -> how far to trust it. */
      .cards { display: flex; flex-direction: column; gap: 10px; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .card:focus-visible, button:focus-visible, .file:focus-within {
        outline: 2px solid var(--accent); outline-offset: 2px;
      }
      .card {
        position: relative; display: grid;
        grid-template-columns: 1fr 120px 170px;
        gap: 20px; align-items: center;
        background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; padding: 20px 22px 20px 28px;
        cursor: pointer; transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      .card:nth-child(1) { background: linear-gradient(90deg, #fff7f7, var(--card) 26%); }
      .card:nth-child(2) { background: linear-gradient(90deg, #faf7ff, var(--card) 26%); }
      .card:nth-child(3) { background: linear-gradient(90deg, #f4faff, var(--card) 26%); }
      .card:hover { transform: translateY(-2px); border-color: var(--faint); box-shadow: 0 12px 30px rgba(24,24,27,0.08); }
      .card-rail {
        position: absolute; left: 0; top: 12px; bottom: 12px;
        width: 5px; border-radius: 0 5px 5px 0;
      }
      .card-rank {
        color: var(--muted); font-size: 10px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.09em; margin-bottom: 4px;
      }
      .card-vendor { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.01em; }
      .card-item { font-size: var(--t-sm); color: var(--muted); margin-top: 1px; }
      .card-move {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px;
        font-variant-numeric: tabular-nums;
      }
      /* half of the comparison the card exists to make -- it has to be readable */
      .card-move .was { color: var(--muted); font-size: var(--t-base); }
      .card-move .arrow { color: var(--muted); }
      .card-move .now { font-size: var(--t-md); font-weight: 600; }
      .card-evidence { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
      .card-spark { text-align: center; }
      .card-spark .spark { margin: 0 auto 4px; }
      .card-impact { text-align: right; }
      .card-impact .impact { font-size: var(--t-xl); letter-spacing: -0.02em; }
      .card-link { font-size: var(--t-sm); color: var(--accent); margin-top: 8px; }
      @media (max-width: 760px) {
        .card { grid-template-columns: 1fr; gap: 12px; }
        .card-spark, .card-impact { text-align: left; }
        .card-spark .spark { margin-left: 0; }
      }

      /* --------------------------------------------------------------- modal */
      .modal {
        position: fixed; z-index: 41; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        width: min(640px, 94vw);
        background: var(--card); border: 1px solid var(--line);
        border-radius: 12px; box-shadow: 0 12px 40px rgba(24,24,27,0.14);
        animation: pop 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } }
      @media (prefers-reduced-motion: reduce) { .modal { animation: none; } }
      .modal-body { padding: 18px 22px 22px; }

      /* ------------------------------------------------ try your own data */
      .try-modal { max-height: 92vh; overflow-y: auto; }
      .dropzone {
        display: flex; flex-direction: column; align-items: center; gap: 4px;
        padding: 30px 16px; cursor: pointer; text-align: center;
        border: 1.5px dashed var(--line); border-radius: var(--radius);
        background: var(--line-soft); font-size: var(--t-md); color: var(--ink);
      }
      .dropzone:hover, .dropzone.over, .dropzone:focus-within {
        border-color: var(--accent); background: #eef2ff;
      }
      .dropzone input { display: none; }
      .try-help { font-size: var(--t-sm); color: var(--muted); line-height: 1.55; margin: 14px 0 12px; }
      .try-links { flex-wrap: wrap; }
      .try-file {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        font-size: var(--t-base); color: var(--ink-soft); margin-bottom: 16px;
      }
      .try-eyebrow { margin-bottom: 8px; }
      .mapping { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin-bottom: 8px; }
      .mapping label { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); color: var(--ink-soft); font-weight: 600; }
      .mapping em { font-style: normal; font-weight: 400; color: var(--muted); }
      .mapping select {
        font: inherit; font-weight: 400; font-size: var(--t-base); color: var(--ink);
        padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
      }
      .mapping select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e51a; }
      @media (max-width: 520px) { .mapping { grid-template-columns: 1fr; } }
      .try-preview {
        font-size: var(--t-base); color: var(--ink-soft); line-height: 1.5;
        padding: 10px 12px; border-radius: 8px; background: var(--line-soft); margin: 12px 0;
      }
      .try-preview details { margin-top: 6px; font-size: var(--t-sm); }
      .try-preview summary { cursor: pointer; color: var(--muted); }
      .skips { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
      .try-actions { justify-content: flex-end; margin-top: 4px; }
      .demo-badge.local { border-color: #a7f3d0; background: #ecfdf5; color: #065f46; }
      .topbar-right button, .topbar-right .faint { white-space: nowrap; }
      @media (max-width: 1180px) { .topbar-right .faint { display: none; } }
      .local-banner {
        display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
        margin: 0 0 18px; padding: 14px 18px; border-radius: var(--radius);
        border: 1px solid #a7f3d0; background: #ecfdf5; color: #065f46; font-size: var(--t-sm);
      }
      .local-banner strong { display: block; font-size: var(--t-base); color: #064e3b; margin-bottom: 2px; }
      .try-cta {
        display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;
        margin-top: 28px;
      }
      .try-cta h2 { margin: 4px 0 6px; font-size: var(--t-lg); color: var(--ink); }
      .try-cta p { margin: 0; max-width: 60ch; color: var(--ink-soft); font-size: var(--t-base); line-height: 1.55; }

      /* ------------------------------------------------------------- table */
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 14px 10px; text-align: left; vertical-align: top; }
      th {
        font-size: var(--t-xs);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--faint);
        padding-bottom: 10px;
        border-bottom: 1px solid var(--line);
      }
      tbody tr { border-bottom: 1px solid var(--line-soft); }
      tbody tr:last-child { border-bottom: 0; }
      tbody tr:hover { background: #fafafa; }
      td:first-child, th:first-child { padding-left: 0; }
      td:last-child,  th:last-child  { padding-right: 0; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }

      .vendor { font-size: var(--t-md); font-weight: 600; letter-spacing: -0.01em; }
      /* Which item's price moved -- a vendor is not the unit of analysis, a
         product from that vendor is. */
      .item-line { font-size: var(--t-sm); color: var(--muted); margin-top: 1px; }
      /* Says out loud when a finding rests on invoice averages rather than unit
         prices, because that evidence cannot separate price from order size. */
      .basis {
        display: inline-block; margin-left: 6px;
        font-size: var(--t-xs); font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.04em; padding: 1px 5px; border-radius: 4px;
        background: var(--warn-bg); color: var(--warn); cursor: help;
      }
      .evidence { display: flex; align-items: center; gap: 7px; margin-top: 6px; }

      /* The annualized figure is what the user acts on -- it outranks the row. */
      .impact { font-size: var(--t-md); font-weight: 600; font-variant-numeric: tabular-nums; }
      .rank {
        font-size: var(--t-sm); font-variant-numeric: tabular-nums;
        color: var(--faint); padding-top: 3px;
      }

      /* Severity has to be visible before the digits are read. */
      .delta {
        display: inline-block;
        font-size: var(--t-sm); font-weight: 600;
        font-variant-numeric: tabular-nums;
        padding: 2px 7px; border-radius: 5px;
        background: var(--warn-bg); color: var(--warn);
      }
      .delta.high { background: var(--alarm-bg); color: var(--alarm); }

      .kind {
        font-size: var(--t-xs); font-weight: 600; text-transform: uppercase;
        letter-spacing: 0.04em; color: var(--muted); margin-top: 4px;
      }
      .kind.drift { color: var(--warn); }

      .spark { width: 104px; height: 30px; display: block; }
      .spark polyline {
        fill: none; stroke: #a1a1aa; stroke-width: 1.5;
        stroke-linejoin: round; vector-effect: non-scaling-stroke;
      }

      /* ------------------------------------------------------------- chart */
      .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
      .chart-max { font-size: var(--t-sm); color: var(--muted); font-variant-numeric: tabular-nums; }
      .chartwrap { position: relative; margin-top: 8px; }
      .idxchart { width: 100%; height: auto; display: block; overflow: visible; }
      .idxchart .grid { stroke: var(--line-soft); stroke-width: 1; }
      /* 100 is the reference the whole chart is read against, so it is drawn. */
      .idxchart .grid.base { stroke: #c7cbd1; stroke-dasharray: 3 3; }
      .idxchart .grid.vert { stroke: var(--line-soft); }
      .idxchart .tick { font-size: var(--t-xs); fill: var(--muted); }

      .idxchart .line {
        fill: none; stroke-width: 1.9;
        stroke-linejoin: round; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        animation: draw 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .idxchart .line { animation: none; stroke-dashoffset: 0; }
      }
      /* Vendors holding their prices recede; the ones costing money carry the ink.
         Stroke colour is set per vendor inline -- hue identifies which line is
         which, and the same hue keys that vendor's sparkline in the table. */
      .idxchart .line.flat { stroke-width: 1.3; }

      /* Invisible fat stroke: a 1.9px line is a hard mouse target. */
      .idxchart .hit { fill: none; stroke: transparent; stroke-width: 16; cursor: pointer; }

      .idxchart g.dim .line, .idxchart .lbl.dim { opacity: 0.18; }
      .idxchart g, .idxchart .lbl { transition: opacity 140ms ease; }

      .idxchart .crosshair { stroke: #a1a1aa; stroke-width: 1; stroke-dasharray: 2 3; }
      /* Hollow ring, vendor-coloured inline: marks the month the detector fired. */
      .idxchart .mark { fill: #fff; stroke-width: 2.5; }
      .idxchart .dot { stroke: #fff; stroke-width: 1.5; }
      .idxchart .lbl { font-size: var(--t-xs); font-weight: 600; fill: var(--ink-soft); }

      /* ------------------------------------------------------------ readout */
      .tip {
        position: absolute; top: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        box-shadow: 0 4px 14px rgba(24, 24, 27, 0.08);
        pointer-events: none;
        min-width: 190px;
      }
      .tip-month {
        font-size: var(--t-xs); font-weight: 600; color: var(--muted);
        text-transform: uppercase; letter-spacing: 0.05em;
        padding-bottom: 6px; margin-bottom: 6px;
        border-bottom: 1px solid var(--line-soft);
      }
      .tip-row {
        display: grid; grid-template-columns: 8px 1fr auto auto;
        align-items: center; gap: 8px;
        font-size: var(--t-sm); padding: 2px 0;
      }
      .swatch { width: 8px; height: 8px; border-radius: 2px; }
      .tip-name { color: var(--ink-soft); white-space: nowrap; }
      .tip-idx {
        font-variant-numeric: tabular-nums; font-weight: 600;
        color: var(--ink); min-width: 26px; text-align: right;
      }
      .tip-amt {
        font-variant-numeric: tabular-nums; color: var(--faint);
        min-width: 34px; text-align: right;
      }
      .empty { color: var(--muted); font-size: var(--t-base); padding: 4px 0 2px; }

      /* ------------------------------------------------------- vendor drawer */
      tbody tr.clickable { cursor: pointer; }
      .scrim {
        position: fixed; inset: 0; background: rgba(24, 24, 27, 0.28);
        animation: fade 160ms ease; z-index: 40;
      }
      @keyframes fade { from { opacity: 0; } }
      .drawer {
        position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
        width: min(660px, 96vw);
        background: var(--card);
        border-left: 1px solid var(--line);
        box-shadow: -8px 0 32px rgba(24, 24, 27, 0.10);
        display: flex; flex-direction: column;
        animation: slide 220ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .scrim, .drawer { animation: none; }
      }
      .drawer-head {
        display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
        padding: 24px 28px 20px; border-bottom: 1px solid #dcdcf7;
        background: linear-gradient(135deg, #fffefa, #f1f3ff);
      }
      .drawer-title {
        display: flex; align-items: center; gap: 9px;
        font-size: var(--t-lg); font-weight: 650; letter-spacing: -0.02em;
      }
      button.close { padding: 4px 9px; font-size: var(--t-base); line-height: 1; }
      .drawer-body { overflow-y: auto; padding: 24px 28px 48px; }

      .evidence-note {
        display: flex; gap: 12px; align-items: flex-start;
        padding: 14px 16px; margin-bottom: 20px;
        border: 1px solid #c7d2fe; border-radius: 10px; background: #eef2ff;
      }
      .evidence-note > span {
        display: grid; place-items: center; flex: 0 0 24px; height: 24px;
        color: #fff; background: var(--accent); border-radius: 50%; font-size: var(--t-sm);
      }
      .evidence-note strong { display: block; color: #312e81; font-size: var(--t-sm); }
      .evidence-note p { margin-top: 2px; color: #4f46e5; font-size: var(--t-sm); line-height: 1.5; }

      .statrow {
        display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
        padding: 18px; margin-bottom: 30px;
        border: 1px solid var(--line); border-radius: 10px; background: #fafafa;
      }
      .stat { font-size: var(--t-lg); font-weight: 600; font-variant-numeric: tabular-nums; }

      .evidence-section-head {
        display: flex; align-items: flex-end; justify-content: space-between; gap: 20px;
        margin-bottom: 13px;
      }
      .evidence-section-head .eyebrow { margin-bottom: 4px; }
      .evidence-section-head h3 {
        font-size: var(--t-lg); line-height: 1.2; letter-spacing: -0.02em; font-weight: 650;
      }
      .evidence-section-head p { color: var(--muted); font-size: var(--t-sm); margin-top: 4px; }
      .count-pill {
        flex: 0 0 auto; padding: 4px 9px; border: 1px solid var(--line);
        border-radius: 999px; background: #fafafa; color: var(--muted);
        font-size: var(--t-xs); font-weight: 600;
      }
      .invoice-head { margin-top: 34px; }

      .flag-events { display: flex; flex-direction: column; gap: 9px; }
      .flag-event {
        display: grid; grid-template-columns: 90px 1.35fr 0.75fr 0.9fr;
        gap: 16px; align-items: center; padding: 15px 16px;
        border: 1px solid #fecaca; border-left: 4px solid var(--alarm);
        border-radius: 10px; background: linear-gradient(90deg, #fff7f7, #fffefa 45%);
      }
      .flag-event > div { min-width: 0; }
      .flag-event span {
        display: block; color: var(--muted); font-size: var(--t-xs);
        font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
      }
      .flag-event strong { display: block; margin-top: 3px; font-size: var(--t-base); }
      .flag-price strong { white-space: nowrap; font-variant-numeric: tabular-nums; }
      .flag-price i { color: var(--muted); font-style: normal; padding: 0 3px; }
      .flag-change strong { color: var(--alarm); }
      .flag-cost { text-align: right; }
      .flag-cost strong { font-size: var(--t-md); font-variant-numeric: tabular-nums; }

      table.mini td { padding: 7px 8px; font-size: var(--t-sm); border-bottom: 1px solid var(--line-soft); }
      table.mini td:first-child { padding-left: 0; }
      table.mini td:last-child { padding-right: 0; }
      table.mini tr:last-child td { border-bottom: 0; }
      .strong { font-weight: 600; }

      /* The receipts. Monospace because it is raw source text, not prose. */
      .invoices { display: flex; flex-direction: column; gap: 10px; }
      .inv {
        padding: 15px 16px; border: 1px solid var(--line); border-radius: 10px;
        background: #fff; box-shadow: 0 4px 14px rgba(24,24,27,0.025);
      }
      .inv:last-child { border-bottom: 1px solid var(--line); }
      .inv-top {
        display: grid; grid-template-columns: 1fr auto auto;
        align-items: center; gap: 10px;
      }
      .inv-date { font-size: var(--t-base); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
      .inv-amt { font-size: var(--t-md); font-variant-numeric: tabular-nums; text-align: right; font-weight: 650; }
      .inv-lines {
        margin: 12px 0 8px; padding: 10px 12px;
        border-radius: 8px; background: #fafafa;
      }
      .inv-lines-label {
        margin-bottom: 5px; color: var(--muted); font-size: 10px;
        font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em;
      }
      .inv-line {
        display: grid; grid-template-columns: 1fr auto 72px;
        gap: 10px; font-size: var(--t-sm); padding: 3px 0;
        font-variant-numeric: tabular-nums;
      }
      .inv-line.editing { grid-template-columns: 1fr auto 72px; align-items: center; padding: 3px 0; }
      .lineedit { display: inline-flex; align-items: center; gap: 5px; }
      .edit.qty   { width: 62px; text-align: right; padding: 2px 5px; font-size: var(--t-sm); }
      .edit.price { width: 78px; text-align: right; padding: 2px 5px; font-size: var(--t-sm); }
      .tiny-save { font-size: var(--t-xs); padding: 2px 8px; }
      .inv-raw {
        font: var(--t-xs)/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--ink-soft); margin-top: 8px; padding: 9px 10px;
        border: 1px solid var(--line); border-radius: 7px; background: #fafafa;
        word-break: break-all;
      }
      .inv-source { margin-top: 7px; }
      .inv-source summary {
        width: max-content; color: var(--accent); cursor: pointer;
        font-size: var(--t-xs); font-weight: 600; list-style-position: inside;
      }
      .inv-source summary:hover { text-decoration: underline; }
      .conf {
        font-size: var(--t-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        padding: 1px 6px; border-radius: 4px; justify-self: start;
      }
      .conf.high   { background: #f4f4f5; color: #52525b; }
      .conf.medium { background: var(--warn-bg); color: var(--warn); }
      .conf.low    { background: var(--alarm-bg); color: var(--alarm); }
      /* A human checked this one. Distinct from "the model felt confident". */
      .conf.corrected { background: #dcfce7; color: #15803d; cursor: help; }

      /* ------------------------------------------------------- corrections */
      .inv .tiny {
        font-size: var(--t-xs); padding: 2px 8px; margin-top: 6px;
        opacity: 0; transition: opacity 120ms ease;
      }
      .inv:hover .tiny, .inv:focus-within .tiny { opacity: 1; }
      .inv.editing {
        background: #fafafa; margin: 0; padding: 15px 16px;
        border-color: #c7d2fe; box-shadow: 0 0 0 3px rgba(79,70,229,0.08);
      }
      .edit {
        font: inherit; font-size: var(--t-sm);
        border: 1px solid var(--line); border-radius: 6px;
        padding: 4px 7px; outline: none;
        font-variant-numeric: tabular-nums;
      }
      .edit:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #4f46e51a; }
      .edit.amt { text-align: right; width: 100px; justify-self: end; }
      .edit.date { width: 138px; }
      .inv-actions { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
      .inv-actions button { font-size: var(--t-sm); padding: 5px 11px; }
      button.danger { color: var(--alarm); border-color: var(--alarm-bg); }
      button.danger:hover:not(:disabled) { border-color: var(--alarm); }
      @media (max-width: 620px) {
        .drawer { width: 100vw; }
        .drawer-head { padding: 20px 18px 16px; }
        .drawer-body { padding: 20px 16px 40px; }
        .statrow { gap: 10px; padding: 14px; }
        .flag-event { grid-template-columns: 1fr 1fr; gap: 13px; }
        .flag-cost { text-align: left; }
        .evidence-section-head { align-items: flex-start; }
        .inv { padding: 13px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
